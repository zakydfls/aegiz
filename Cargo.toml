[workspace]
resolver = "2"
members = [
    "crates/aegiz-core",
    "crates/aegiz-credentials",
    "crates/aegiz-domain",
    "crates/aegiz-platform",
    "crates/aegiz-storage",
    "crates/aegiz-terminal",
    "crates/aegiz-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.98"
async-stream = "0.3.6"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive"] }
hex = "0.4.3"
keyring = "4.1.6"
portable-pty = "0.9.0"
prost = "0.14.1"
rand = "0.9.1"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "postgres", "mysql", "chrono", "uuid"] }
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = "0.14.1"
tonic-prost = "0.14.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.17.0", features = ["v4", "v5", "serde"] }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
